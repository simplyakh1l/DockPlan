name: Verify DockPlan
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm ci --prefix server && npm ci --prefix client
      - run: npm test
        env:
          DOCKPLAN_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/dockplan_ci
      - run: npm run build
      - run: npm audit --prefix server --audit-level=high && npm audit --prefix client --audit-level=high
